seed: 42

model:
  # Research default: pretrained CLIP vision patch tokens. Use tiny_cnn only for smoke tests.
  backbone: clip
  backbone_name: openai/clip-vit-base-patch32
  local_files_only: false
  train_backbone: false
  unfreeze_last_n_layers: 0
  # These values are resolved/validated from the loaded checkpoint at startup.
  visual_dim: 768
  d_model: 256
  d_latent: 512
  num_queries: 64
  top_m_objects: 16
  top_k_pairs: 64

training:
  epochs: 10
  batch_size: 2
  num_workers: 0
  lr: 0.0001
  weight_decay: 0.0001
  image_size: 224
  device: auto
  amp: false
  save_every: 1

augmentation:
  enabled: true
  hflip_prob: 0.5
  color_jitter: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.05
  random_resized_crop: false

matching:
  cost_class: 1.0
  cost_bbox: 5.0
  cost_objectness: 1.0

loss:
  objectness: 1.0
  leaf: 1.0
  group: 0.35
  ancestor: 0.25
  sibling: 0.25
  box_l1: 5.0
  relationness: 1.0
  predicate: 1.0

stages:
  detector_warmup_epochs: 2
  hierarchical_epochs: 2
  relation_epochs: 3
  joint_epochs: 3

ontology:
  path: ontology/ontology_v1.json
  text_dim: 512
  prompt_template: "a photo of a {label}"
  trainable_prototypes: false

paths:
  output_dir: runs/default
  checkpoint: null

evaluation:
  top_k_triplets: [20, 50, 100]
