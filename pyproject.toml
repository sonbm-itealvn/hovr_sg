[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hovr-sg"
version = "0.1.0"
description = "Hierarchical Open-Vocabulary Relational Scene Graph detector"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Manus AI"}]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "pyyaml>=6.0",
  "pillow>=9.5",
  "numpy>=1.24",
  "tqdm>=4.65",
  "transformers>=4.40",
  "safetensors>=0.4",
]

[project.optional-dependencies]
vlm = [
  "sentencepiece>=0.1.99",
]
eval = [
  "scikit-learn>=1.3",
  "pycocotools>=2.0.7",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.scripts]
hovr-convert-vg = "tools.convert_visual_genome:main"
hovr-convert-oi = "tools.convert_open_images:main"
hovr-convert-gqa = "tools.convert_gqa:main"
hovr-inspect = "scripts.inspect_dataset:main"
hovr-train = "scripts.train:main"
hovr-eval = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["hovr_sg*", "tools*", "scripts*"]

[tool.ruff]
line-length = 100

target-version = "py310"
